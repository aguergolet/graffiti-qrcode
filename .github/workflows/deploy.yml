name: Deploy to Production Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🚀 Starting deployment to $SERVER_HOST..."
        
        # Connect to server and execute deployment commands
        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
          echo "📁 Navigating to deployment directory..."
          cd $DEPLOY_PATH
          
          echo "📥 Pulling latest changes from git..."
          git pull origin main
          
          echo "🔧 Running build script..."
          chmod +x build.sh
          ./build.sh
          
          echo "✅ Deployment completed successfully!"
          
          # Check if containers are running
          echo "🔍 Checking container status..."
          docker ps --filter "name=qrcode_website"
          
          echo "📊 Container logs (last 10 lines):"
          docker logs --tail 10 qrcode_website
        EOF
        
    - name: Verify deployment
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🔍 Verifying deployment..."
        
        # Check if the application is responding
        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'EOF'
          echo "⏳ Waiting for application to start..."
          sleep 30
          
          echo "🔍 Checking container health..."
          if docker ps --filter "name=qrcode_website" --filter "status=running" | grep -q qrcode_website; then
            echo "✅ Container is running successfully"
            
            # Check if the application is responding (optional)
            echo "🌐 Checking application health..."
            if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null | grep -q "200"; then
              echo "✅ Application is responding"
            else
              echo "⚠️  Application health check failed (this might be normal if no health endpoint exists)"
            fi
          else
            echo "❌ Container is not running properly"
            echo "📋 Container status:"
            docker ps -a --filter "name=qrcode_website"
            echo "📋 Container logs:"
            docker logs qrcode_website
            exit 1
          fi
        EOF
        
    - name: Deployment Summary
      if: always()
      run: |
        echo "🎯 Deployment job completed!"
        echo "📅 Timestamp: $(date)"
        echo "🔗 Repository: ${{ github.repository }}"
        echo "📝 Commit: ${{ github.sha }}"
        echo "👤 Author: ${{ github.actor }}"
